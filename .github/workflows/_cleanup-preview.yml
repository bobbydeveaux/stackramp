name: "Cleanup Preview Environment"

# Reusable workflow — called by consuming repos on PR close.
# Deletes every Cloud Run preview service created for the PR and its Firebase
# preview channel, then sweeps the app's other closed PRs (previews a deploy
# created after their own cleanup had already run).
#
# Preview service names (see platform.yml / _mcp.yml):
#   {app}-pr-N         primary backend
#   {app}-fe-pr-N      SSO frontend
#   {app}-{name}-pr-N  every named entry in the `backends` output: the mcp
#                      block ("mcp") and each backends[] entry (e.g. ingest,
#                      worker, browser)
# plus any service labelled stackramp-app={app}, stackramp-pr=N (preview
# deploys add these). The logic lives in providers/gcp/workflows/preview-sweep.
#
# The caller's workflow must listen for `pull_request: types: [..., closed]`;
# the default pull_request types do not include `closed`, so without it this
# job never runs.

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to stackramp.yaml"
        type: string
        required: false
        default: "stackramp.yaml"

permissions:
  id-token: write
  contents: read
  pull-requests: read   # the sweep reads other PRs' state

jobs:
  cleanup:
    name: Cleanup PR preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse config
        id: config
        uses: bobbydeveaux/stackramp/platform-action@main
        with:
          config_path: ${{ inputs.config_path }}

      - name: Authenticate to Google Cloud
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/auth@main
        with:
          wif_provider: ${{ vars.STACKRAMP_WIF_PROVIDER }}
          service_account: ${{ vars.STACKRAMP_SA_EMAIL }}

      - name: Delete this PR's preview
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/preview-sweep@main
        with:
          app_name: ${{ steps.config.outputs.app_name }}
          backends: ${{ steps.config.outputs.backends }}
          project: ${{ vars.STACKRAMP_PROJECT }}
          region: ${{ vars.STACKRAMP_REGION || 'europe-west1' }}
          pr: ${{ github.event.number }}

      # Backstop for the deploy/cleanup race: any other closed PR's preview
      # still around. Never fails the cleanup (the scheduled sweep retries).
      - name: Sweep other closed PRs' previews
        continue-on-error: true
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/preview-sweep@main
        with:
          app_name: ${{ steps.config.outputs.app_name }}
          backends: ${{ steps.config.outputs.backends }}
          project: ${{ vars.STACKRAMP_PROJECT }}
          region: ${{ vars.STACKRAMP_REGION || 'europe-west1' }}
