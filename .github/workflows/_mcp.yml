name: "Deploy MCP Server (GCP)"

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      name:
        type: string
        required: false
        default: "mcp"
        description: "Service-name suffix — deploys as {app}-{name}-{env}. Defaults to 'mcp' (unchanged for the legacy mcp: block); v2 machine backends pass their own name (e.g. 'ingest')."
      service_accounts:
        type: string
        required: false
        default: ""
        description: "Semicolon-joined SA emails allow-listed to call this service with Google-signed ID tokens. Injected as BOTH STACKRAMP_SERVICE_ACCOUNTS and (for posterity) MCP_SERVICE_ACCOUNTS."
      mcp_dir:
        type: string
        required: true
        default: mcp
      mcp_language:
        type: string
        required: true
        default: go
      mcp_port:
        type: number
        required: true
        default: 8080
      environment:
        type: string
        required: true
      platform_project:
        type: string
        required: true
      region:
        type: string
        required: false
        default: europe-west1
      wif_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
      memory:
        type: string
        required: false
        default: "256Mi"
      cpu:
        type: string
        required: false
        default: "1"
      min_instances:
        description: "Minimum instances kept warm. Ignored for PR previews (pr-<n>), which always scale to zero."
        type: number
        required: false
        default: 0
      max_instances:
        type: number
        required: false
        default: 10
      always_on:
        description: "CPU always allocated; at least one instance kept up. For long-lived connections. Ignored for PR previews (pr-<n>): CPU throttled, scale to zero."
        type: boolean
        required: false
        default: false
      timeout:
        description: "Request timeout in seconds (Cloud Run allows up to 3600)."
        type: number
        required: false
        default: 300
      frontend_url:
        type: string
        required: false
        default: ""
      backend_url:
        type: string
        required: false
        default: ""
      iap_allowed_domain:
        type: string
        required: false
        default: ""
        description: "Google Workspace domain for the run.invoker IAM binding (e.g. toucanberry.com). Sourced from STACKRAMP_IAP_DOMAIN."
      vpc_connector:
        type: string
        required: false
        default: ""
        description: "Serverless VPC Access Connector. Required to reach an ingress=internal backend — egress is set to all-traffic so backend calls originate inside the VPC (same as the SSO frontend proxy)."
      cloudsql_connection_name:
        type: string
        required: false
        default: ""
        description: "Cloud SQL instance connection name (project:region:instance). Set when the app has a database and this machine/ingest service needs direct DB access (e.g. a telemetry-ingest service that WRITES to the app DB)."
      database_secret_name:
        type: string
        required: false
        default: ""
        description: "Secret Manager secret ID holding DATABASE_URL for this app. Mounted as DATABASE_URL when set — mirrors _backend.yml so a machine service can reach the same DB the backend does."
      public:
        type: string
        required: false
        default: "false"
        description: "When true, deploy --allow-unauthenticated (allUsers) so MCP OAuth discovery works for clients like Claude Code. Requires an org policy permitting allUsers; auth is enforced in-app."
      extra_env_vars:
        type: string
        required: false
        default: ""
        description: "Additional comma-separated KEY=VALUE env vars to inject into Cloud Run."
    outputs:
      url:
        description: "Deployed MCP server URL"
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  id-token: write
  contents: read
  pull-requests: read   # PR previews: is the PR still open?

jobs:
  deploy:
    name: Cloud Run (MCP)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/auth@main
        with:
          wif_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}

      # gcloud is preinstalled on GitHub-hosted runners; installing the latest
      # copy cost ~25s per job. Self-hosted runners without it still install.
      - name: Check for gcloud
        id: gcloud
        run: echo "preinstalled=$(command -v gcloud >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: ${{ steps.gcloud.outputs.preinstalled == 'true' }}

      # Built once per commit and platform version: tagged <sha>-<platform
      # fingerprint> by the action and skipped when that image already exists
      # (pushed by the platform's pre-build job, or by the dev deploy for prod).
      - name: Build Docker image
        id: build
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/build-image@main
        with:
          context: ${{ inputs.mcp_dir }}
          language: ${{ inputs.mcp_language }}
          images: ${{ inputs.app_name }}-${{ inputs.name }}
          registry: ${{ inputs.region }}-docker.pkg.dev/${{ inputs.platform_project }}/stackramp-images
          tag: ${{ github.sha }}

      - name: Export image ref
        run: echo "IMAGE=${{ steps.build.outputs.image }}" >> "$GITHUB_ENV"

      # Platform secrets for this app and environment: platform-inject=true,
      # narrowed by the optional platform-app / platform-env labels. One
      # shared action so every deploy path applies the same rules.
      - name: Discover platform secrets
        id: platform_secrets
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/platform-secrets@main
        with:
          project: ${{ inputs.platform_project }}
          app_name: ${{ inputs.app_name }}
          environment: ${{ inputs.environment }}

      # PR previews: a deploy that starts after its PR closed (marked ready
      # and merged seconds later) would recreate services the PR-close
      # cleanup has already deleted. Skip the deploy then. dev/prod: always
      # closed=false, no API call.
      - name: Check the PR is still open
        id: pr_before
        uses: bobbydeveaux/stackramp/platform-action/pr-closed@main
        with:
          environment: ${{ inputs.environment }}

      - name: Skip (PR already closed)
        if: steps.pr_before.outputs.closed == 'true'
        run: echo "::notice::PR #${{ steps.pr_before.outputs.pr }} is closed; not deploying its preview"

      - name: Deploy to Cloud Run
        if: steps.pr_before.outputs.closed != 'true'
        env:
          PLATFORM_SECRET_REFS: ${{ steps.platform_secrets.outputs.secret_refs }}
          PLATFORM_CLEAR_SECRETS: ${{ steps.platform_secrets.outputs.clear_secrets }}
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.name }}-${{ inputs.environment }}"

          ENV_VARS="ENVIRONMENT=${{ inputs.environment }},APP_NAME=${{ inputs.app_name }}"
          [ -n "${{ inputs.frontend_url }}" ] && ENV_VARS="${ENV_VARS},FRONTEND_URL=${{ inputs.frontend_url }}"
          [ -n "${{ inputs.backend_url }}" ]  && ENV_VARS="${ENV_VARS},BACKEND_URL=${{ inputs.backend_url }}"
          [ -n "${{ inputs.extra_env_vars }}" ] && ENV_VARS="${ENV_VARS},${{ inputs.extra_env_vars }}"
          # Machine allow-list: inject under the v2 name AND the legacy name.
          if [ -n "${{ inputs.service_accounts }}" ]; then
            ENV_VARS="${ENV_VARS},STACKRAMP_SERVICE_ACCOUNTS=${{ inputs.service_accounts }},MCP_SERVICE_ACCOUNTS=${{ inputs.service_accounts }}"
          fi

          # Platform secrets for this app and environment (platform-secrets step).
          SECRET_REFS="${PLATFORM_SECRET_REFS}"
          # App DATABASE_URL (same secret _backend.yml mounts) — so an ingest/
          # machine service can WRITE to the app DB the backend reads.
          if [ -n "${{ inputs.database_secret_name }}" ]; then
            SECRET_REFS="${SECRET_REFS:+$SECRET_REFS,}DATABASE_URL=${{ inputs.database_secret_name }}:latest"
          fi

          # always_on: CPU stays allocated between requests (work outside a
          # request, long-lived sockets) and one instance is always up.
          MIN_INSTANCES="${{ inputs.min_instances }}"
          CPU_FLAG="--cpu-throttling"
          if [ "${{ inputs.always_on }}" = "true" ]; then
            CPU_FLAG="--no-cpu-throttling"
            [ "$MIN_INSTANCES" -lt 1 ] && MIN_INSTANCES=1
          fi
          # PR previews always scale to zero with CPU throttled, whatever
          # min_instances / always_on say: those are for dev and prod, and on
          # a preview they kept one instance per open PR running 24/7.
          PREVIEW_LABELS=()
          if [[ "${{ inputs.environment }}" =~ ^pr-([0-9]+)$ ]]; then
            MIN_INSTANCES=0
            CPU_FLAG="--cpu-throttling"
            # Lets the preview sweep find this service by app and PR.
            PREVIEW_LABELS=(--update-labels="stackramp-app=${{ inputs.app_name }},stackramp-pr=${BASH_REMATCH[1]}")
          fi

          DEPLOY_FLAGS=(
            --image="$IMAGE"
            --region="${{ inputs.region }}"
            --platform=managed
            --port="${{ inputs.mcp_port }}"
            --set-env-vars="${ENV_VARS}"
            --memory="${{ inputs.memory }}"
            --cpu="${{ inputs.cpu }}"
            --min-instances="$MIN_INSTANCES"
            --max-instances="${{ inputs.max_instances }}"
            --timeout="${{ inputs.timeout }}"
            "$CPU_FLAG"
            --project="${{ inputs.platform_project }}"
            --ingress=all
            "${PREVIEW_LABELS[@]}"
          )
          if [ "${{ inputs.public }}" = "true" ]; then
            # Public MCP: reachable client->server by external OAuth clients
            # (Claude, claude.ai, Inspector); auth is enforced in-app via OAuth.
            # Use --no-invoker-iam-check, NOT --allow-unauthenticated: the latter
            # adds an allUsers IAM binding that the DomainRestrictedSharing org
            # policy rejects. Disabling the invoker IAM check makes the endpoint
            # reachable without any public IAM grant, so the org policy is
            # untouched and the MCP server's own OAuth gates access.
            DEPLOY_FLAGS+=(--no-invoker-iam-check)
          else
            DEPLOY_FLAGS+=(--no-allow-unauthenticated)
          fi
          if [ -n "$SECRET_REFS" ]; then
            DEPLOY_FLAGS+=(--set-secrets="$SECRET_REFS")
          elif [ "$PLATFORM_CLEAR_SECRETS" = "true" ]; then
            # Every platform secret is scoped to other apps/envs: take off
            # any this service still has (see the platform-secrets action).
            DEPLOY_FLAGS+=(--clear-secrets)
          fi
          [ -n "${{ inputs.vpc_connector }}" ] && DEPLOY_FLAGS+=(--vpc-connector="${{ inputs.vpc_connector }}" --vpc-egress=all-traffic)
          [ -n "${{ inputs.cloudsql_connection_name }}" ] && DEPLOY_FLAGS+=(--add-cloudsql-instances="${{ inputs.cloudsql_connection_name }}")

          gcloud run deploy "$SERVICE_NAME" "${DEPLOY_FLAGS[@]}"

      - name: Grant domain invoker on MCP service
        if: inputs.iap_allowed_domain != '' && inputs.public != 'true' && steps.pr_before.outputs.closed != 'true'
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.name }}-${{ inputs.environment }}"
          IFS=',' read -ra DOMAINS <<< "${{ inputs.iap_allowed_domain }}"
          for DOMAIN in "${DOMAINS[@]}"; do
            DOMAIN=$(echo "$DOMAIN" | xargs)
            [ -z "$DOMAIN" ] && continue
            gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
              --region="${{ inputs.region }}" \
              --project="${{ inputs.platform_project }}" \
              --member="domain:${DOMAIN}" \
              --role="roles/run.invoker" \
              --quiet
          done

      - name: Get deployed URL
        id: url
        if: steps.pr_before.outputs.closed != 'true'
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.name }}-${{ inputs.environment }}"
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region=${{ inputs.region }} \
            --project=${{ inputs.platform_project }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "MCP server deployed: $URL"

          # Inject SERVICE_URL = the service's own Cloud Run URL. A machine
          # service needs its own URL as the expected OIDC `aud` when verifying
          # caller ID tokens (StackRamp access: machine), and as the issuer for
          # in-app OAuth discovery. The URL isn't known until first deploy, so
          # set it here (idempotent; skipped when already correct to avoid a
          # needless revision).
          CURRENT=$(gcloud run services describe "$SERVICE_NAME" \
            --region=${{ inputs.region }} --project=${{ inputs.platform_project }} \
            --format=json 2>/dev/null \
            | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="SERVICE_URL") | .value' 2>/dev/null || true)
          if [ "$CURRENT" != "$URL" ]; then
            echo "Setting SERVICE_URL=$URL on $SERVICE_NAME"
            gcloud run services update "$SERVICE_NAME" \
              --region=${{ inputs.region }} --project=${{ inputs.platform_project }} \
              --update-env-vars="SERVICE_URL=$URL" --quiet
          fi

      # The PR closed while this deploy ran: its cleanup may already have
      # run, so delete what this job just created.
      - name: Check the PR is still open (after deploy)
        id: pr_after
        # Also after a failed step: gcloud may have created the service.
        if: "!cancelled() && startsWith(inputs.environment, 'pr-') && steps.pr_before.outputs.closed != 'true'"
        uses: bobbydeveaux/stackramp/platform-action/pr-closed@main
        with:
          environment: ${{ inputs.environment }}
          # Can't tell: fail, so the job is rerun, rather than keep a preview
          # the close cleanup may already have missed.
          fail_open: "false"

      - name: Delete the preview (PR closed during deploy)
        if: "!cancelled() && steps.pr_after.outputs.closed == 'true'"
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.name }}-${{ inputs.environment }}"
          echo "::notice::PR #${{ steps.pr_after.outputs.pr }} closed during the deploy; deleting ${SERVICE_NAME}"
          if ! gcloud run services delete "$SERVICE_NAME" \
              --region="${{ inputs.region }}" --project="${{ inputs.platform_project }}" --quiet; then
            # Fine only when it's gone (the PR-close cleanup got there first).
            if ERR=$(gcloud run services describe "$SERVICE_NAME" \
                --region="${{ inputs.region }}" --project="${{ inputs.platform_project }}" 2>&1 >/dev/null) \
                || ! grep -qiE "cannot find|not found" <<<"$ERR"; then
              echo "::error::Could not delete ${SERVICE_NAME}"; exit 1
            fi
          fi
