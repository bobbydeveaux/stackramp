name: "Deploy Backend (GCP)"

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      backend_dir:
        type: string
        required: true
        default: backend
      backend_language:
        type: string
        required: true
        default: python
      backend_port:
        type: number
        required: true
        default: 8080
      environment:
        type: string
        required: true
      platform_project:
        type: string
        required: true
      region:
        type: string
        required: true
        default: europe-west1
      wif_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
      memory:
        type: string
        required: false
        default: "512Mi"
      cpu:
        type: string
        required: false
        default: "1"
      frontend_url:
        type: string
        required: false
        default: ""
      storage_bucket:
        type: string
        required: false
        default: ""
      bucket_env_json:
        type: string
        required: false
        default: "{}"
        description: "JSON map of logical bucket name -> resolved GCS bucket name (storage.buckets block). Each entry is injected as env var BUCKET_<NAME_UPPER>."
      extra_env_vars:
        type: string
        required: false
        default: ""
        description: "Additional comma-separated KEY=VALUE env vars to inject into Cloud Run (non-secret config only)."
      cloudsql_connection_name:
        type: string
        required: false
        default: ""
        description: "Cloud SQL instance connection name (project:region:instance). Required when the app has a database."
      vpc_connector:
        type: string
        required: false
        default: ""
        description: "Serverless VPC Access Connector name for Cloud SQL private IP connectivity."
      database_secret_name:
        type: string
        required: false
        default: ""
        description: "Secret Manager secret ID holding DATABASE_URL for this app. Mounted directly into Cloud Run."
      min_instances:
        type: string
        required: false
        default: "0"
        description: "Minimum number of Cloud Run instances to keep warm. Default 0 (scale to zero). Ignored for PR previews (pr-<n>), which always scale to zero."
      max_instances:
        type: string
        required: false
        default: "10"
        description: "Maximum number of Cloud Run instances (backend.max_instances). Default 10."
      sso:
        type: string
        required: false
        default: "false"
        description: "When true, Cloud Run is deployed without --allow-unauthenticated (IAP handles auth)."
      frontend_sa:
        type: string
        required: false
        default: ""
        description: "Frontend SA email — granted run.invoker on the backend after deploy (for SSO service-to-service auth)."
      migrate_command:
        type: string
        required: false
        default: ""
        description: "Migration command to run via Cloud Run Job before deploy. Empty = skip migrations."
    outputs:
      url:
        description: "Deployed backend URL"
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  id-token: write
  contents: read
  pull-requests: read   # PR previews: is the PR still open?

jobs:
  deploy:
    name: Cloud Run
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/auth@main
        with:
          wif_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}

      # gcloud is preinstalled on GitHub-hosted runners; installing the latest
      # copy cost ~25s per job. Self-hosted runners without it still install.
      - name: Check for gcloud
        id: gcloud
        run: echo "preinstalled=$(command -v gcloud >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: ${{ steps.gcloud.outputs.preinstalled == 'true' }}

      # Built once per commit and platform version: tagged <sha>-<platform
      # fingerprint> by the action and skipped when that image already exists
      # (pushed by the platform's pre-build job, or by the dev deploy for prod).
      - name: Build Docker image
        id: build
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/build-image@main
        with:
          context: ${{ inputs.backend_dir }}
          language: ${{ inputs.backend_language }}
          images: ${{ inputs.app_name }}
          registry: ${{ inputs.region }}-docker.pkg.dev/${{ inputs.platform_project }}/stackramp-images
          tag: ${{ github.sha }}

      - name: Export image ref
        run: echo "IMAGE=${{ steps.build.outputs.image }}" >> "$GITHUB_ENV"

      # Platform secrets for this app and environment: platform-inject=true,
      # narrowed by the optional platform-app / platform-env labels. One
      # shared action so every deploy path applies the same rules.
      - name: Discover platform secrets
        id: platform_secrets
        uses: bobbydeveaux/stackramp/providers/gcp/workflows/platform-secrets@main
        with:
          project: ${{ inputs.platform_project }}
          app_name: ${{ inputs.app_name }}
          environment: ${{ inputs.environment }}

      # PR previews: a deploy that starts after its PR closed (marked ready
      # and merged seconds later) would recreate services the PR-close
      # cleanup has already deleted. Skip the migrations and deploy then.
      # dev/prod: always closed=false, no API call.
      - name: Check the PR is still open
        id: pr_before
        uses: bobbydeveaux/stackramp/platform-action/pr-closed@main
        with:
          environment: ${{ inputs.environment }}

      - name: Skip (PR already closed)
        if: steps.pr_before.outputs.closed == 'true'
        run: echo "::notice::PR #${{ steps.pr_before.outputs.pr }} is closed; not deploying its preview"

      - name: Run database migrations
        if: inputs.migrate_command != '' && steps.pr_before.outputs.closed != 'true'
        env:
          PLATFORM_SECRET_REFS: ${{ steps.platform_secrets.outputs.secret_refs }}
        run: |
          JOB_NAME="${{ inputs.app_name }}-migrate-${{ inputs.environment }}"

          # Build secret refs (same platform secrets as the deploy step)
          SECRET_REFS="DATABASE_URL=${{ inputs.database_secret_name }}:latest"
          SECRET_REFS="${SECRET_REFS}${PLATFORM_SECRET_REFS:+,$PLATFORM_SECRET_REFS}"

          # Job definition flags
          JOB_FLAGS=(
            --image="$IMAGE"
            --region="${{ inputs.region }}"
            --project="${{ inputs.platform_project }}"
            --set-secrets="$SECRET_REFS"
            --max-retries=0
            --command="/bin/sh"
            --args="-c,${{ inputs.migrate_command }}"
          )
          [ -n "${{ inputs.cloudsql_connection_name }}" ] && \
            JOB_FLAGS+=(--set-cloudsql-instances="${{ inputs.cloudsql_connection_name }}")
          [ -n "${{ inputs.vpc_connector }}" ] && \
            JOB_FLAGS+=(--vpc-connector="${{ inputs.vpc_connector }}" --vpc-egress=private-ranges-only)

          # Create or update job definition
          if gcloud run jobs describe "$JOB_NAME" \
              --region="${{ inputs.region }}" \
              --project="${{ inputs.platform_project }}" 2>/dev/null; then
            echo "Updating existing migration job..."
            gcloud run jobs update "$JOB_NAME" "${JOB_FLAGS[@]}"
          else
            echo "Creating migration job..."
            gcloud run jobs create "$JOB_NAME" "${JOB_FLAGS[@]}"
          fi

          # Execute and wait — blocks until complete, fails if migration fails
          echo "Running migrations..."
          gcloud run jobs execute "$JOB_NAME" \
            --region="${{ inputs.region }}" \
            --project="${{ inputs.platform_project }}" \
            --wait

      - name: Deploy to Cloud Run
        if: steps.pr_before.outputs.closed != 'true'
        env:
          # JSON map passed via env to avoid quote-handling issues inline.
          BUCKET_ENV_JSON: ${{ inputs.bucket_env_json }}
          PLATFORM_SECRET_REFS: ${{ steps.platform_secrets.outputs.secret_refs }}
          PLATFORM_CLEAR_SECRETS: ${{ steps.platform_secrets.outputs.clear_secrets }}
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.environment }}"

          # ── Env vars (non-secret config) ────────────────────────────────────
          ENV_VARS="ENVIRONMENT=${{ inputs.environment }},APP_NAME=${{ inputs.app_name }},FRONTEND_URL=${{ inputs.frontend_url }}"
          # Legacy single bucket (storage: gcs) — kept for back-compat.
          if [ -n "${{ inputs.storage_bucket }}" ]; then
            ENV_VARS="${ENV_VARS},GCS_BUCKET=${{ inputs.storage_bucket }}"
          fi
          # storage.buckets block — inject one BUCKET_<NAME_UPPER>=<bucketname>
          # per declared bucket. Mirrors the platform_secrets discovery pattern:
          # iterate the resolved map and append each key/value as an env var.
          if [ -n "$BUCKET_ENV_JSON" ] && [ "$BUCKET_ENV_JSON" != "{}" ] && [ "$BUCKET_ENV_JSON" != "null" ]; then
            while IFS=$'\t' read -r LOGICAL BUCKET; do
              [ -z "$LOGICAL" ] && continue
              VAR_NAME="BUCKET_$(echo "$LOGICAL" | tr '[:lower:]-' '[:upper:]_')"
              ENV_VARS="${ENV_VARS},${VAR_NAME}=${BUCKET}"
            done < <(echo "$BUCKET_ENV_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
          fi
          if [ -n "${{ inputs.extra_env_vars }}" ]; then
            ENV_VARS="${ENV_VARS},${{ inputs.extra_env_vars }}"
          fi

          # ── .env file (backend/.env.{environment}) ───────────────────────────
          # Convention: commit a .env.prod / .env.dev in your backend dir for
          # non-sensitive config. Secret values belong in Secret Manager instead.
          ENV_FILE="${{ inputs.backend_dir }}/.env.${{ inputs.environment }}"
          if [ -f "$ENV_FILE" ]; then
            echo "Loading env vars from $ENV_FILE"
            while IFS= read -r line || [ -n "$line" ]; do
              # skip blank lines and comments
              [[ -z "$line" || "$line" == \#* ]] && continue
              ENV_VARS="${ENV_VARS},${line}"
            done < "$ENV_FILE"
          fi

          # ── Secret refs (mounted by Cloud Run directly from Secret Manager) ─
          # Platform secrets: labelled platform-inject=true (and, when set,
          # platform-app / platform-env matching this service), discovered by
          # the platform-secrets step — no workflow changes needed when the
          # platform team adds a new secret via bootstrap terraform.
          SECRET_REFS="${PLATFORM_SECRET_REFS}"

          # App-specific database secret (generated by platform terraform)
          if [ -n "${{ inputs.database_secret_name }}" ]; then
            SECRET_REFS="${SECRET_REFS:+$SECRET_REFS,}DATABASE_URL=${{ inputs.database_secret_name }}:latest"
          fi

          # ── Instances ───────────────────────────────────────────────────────
          # PR previews always scale to zero: a min_instances meant for prod
          # (latency) would keep one instance per open PR running 24/7.
          MIN_INSTANCES="${{ inputs.min_instances }}"
          PREVIEW_LABELS=()
          if [[ "${{ inputs.environment }}" =~ ^pr-([0-9]+)$ ]]; then
            MIN_INSTANCES=0
            # Lets the preview sweep find this service by app and PR.
            PREVIEW_LABELS=(--update-labels="stackramp-app=${{ inputs.app_name }},stackramp-pr=${BASH_REMATCH[1]}")
          fi

          # ── Build deploy flags ───────────────────────────────────────────────
          DEPLOY_FLAGS=(
            --image="$IMAGE"
            --region="${{ inputs.region }}"
            --platform=managed
            --port="${{ inputs.backend_port }}"
            --set-env-vars="${ENV_VARS}"
            --memory="${{ inputs.memory }}"
            --cpu="${{ inputs.cpu }}"
            --min-instances="$MIN_INSTANCES"
            --max-instances=${{ inputs.max_instances }}
            --timeout=300
            --cpu-throttling
            --project="${{ inputs.platform_project }}"
            "${PREVIEW_LABELS[@]}"
          )
          if [ "${{ inputs.sso }}" = "true" ]; then
            if [ -n "${{ inputs.vpc_connector }}" ]; then
              # Restrictive org: VPC handles network isolation. allow-unauthenticated
              # avoids IAM race (org policy silently blocks allUsers anyway).
              DEPLOY_FLAGS+=(--allow-unauthenticated --ingress=internal)
            else
              # Permissive org: Go proxy authenticates via identity token.
              # Backend locked to authenticated callers only.
              DEPLOY_FLAGS+=(--no-allow-unauthenticated --ingress=all)
            fi
          else
            DEPLOY_FLAGS+=(--allow-unauthenticated --ingress=all)
          fi
          if [ -n "$SECRET_REFS" ]; then
            DEPLOY_FLAGS+=(--set-secrets="$SECRET_REFS")
          elif [ "$PLATFORM_CLEAR_SECRETS" = "true" ]; then
            # Every platform secret is scoped to other apps/envs: take off
            # any this service still has (see the platform-secrets action).
            DEPLOY_FLAGS+=(--clear-secrets)
          fi
          [ -n "${{ inputs.vpc_connector }}" ] && DEPLOY_FLAGS+=(--vpc-connector="${{ inputs.vpc_connector }}" --vpc-egress=private-ranges-only)
          [ -n "${{ inputs.cloudsql_connection_name }}" ] && DEPLOY_FLAGS+=(--add-cloudsql-instances="${{ inputs.cloudsql_connection_name }}")

          gcloud run deploy "$SERVICE_NAME" "${DEPLOY_FLAGS[@]}"

      - name: Grant frontend SA invoker on backend (SSO)
        if: inputs.sso == 'true' && inputs.frontend_sa != '' && steps.pr_before.outputs.closed != 'true'
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.environment }}"
          echo "Granting ${{ inputs.frontend_sa }} run.invoker on ${SERVICE_NAME}"
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --region="${{ inputs.region }}" \
            --project="${{ inputs.platform_project }}" \
            --member="serviceAccount:${{ inputs.frontend_sa }}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Get deployed URL
        id: url
        if: steps.pr_before.outputs.closed != 'true'
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.environment }}"
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region=${{ inputs.region }} \
            --project=${{ inputs.platform_project }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Backend deployed: $URL"

      # The PR closed while this deploy ran: its cleanup may already have
      # run, so delete what this job just created.
      - name: Check the PR is still open (after deploy)
        id: pr_after
        # Also after a failed step: gcloud may have created the service.
        if: "!cancelled() && startsWith(inputs.environment, 'pr-') && steps.pr_before.outputs.closed != 'true'"
        uses: bobbydeveaux/stackramp/platform-action/pr-closed@main
        with:
          environment: ${{ inputs.environment }}
          # Can't tell: fail, so the job is rerun, rather than keep a preview
          # the close cleanup may already have missed.
          fail_open: "false"

      - name: Delete the preview (PR closed during deploy)
        if: "!cancelled() && steps.pr_after.outputs.closed == 'true'"
        run: |
          SERVICE_NAME="${{ inputs.app_name }}-${{ inputs.environment }}"
          echo "::notice::PR #${{ steps.pr_after.outputs.pr }} closed during the deploy; deleting ${SERVICE_NAME}"
          if ! gcloud run services delete "$SERVICE_NAME" \
              --region="${{ inputs.region }}" --project="${{ inputs.platform_project }}" --quiet; then
            # Fine only when it's gone (the PR-close cleanup got there first).
            if ERR=$(gcloud run services describe "$SERVICE_NAME" \
                --region="${{ inputs.region }}" --project="${{ inputs.platform_project }}" 2>&1 >/dev/null) \
                || ! grep -qiE "cannot find|not found" <<<"$ERR"; then
              echo "::error::Could not delete ${SERVICE_NAME}"; exit 1
            fi
          fi
